name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build (clean build)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee build-output.log
      - name: GameTests (dedicated logical server)
        if: success()
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest-output.log
      - name: Dedicated server boot smoke test
        if: success()
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=flat\nspawn-protection=0\n" > run/server.properties
          mkfifo server-in
          (./gradlew runServer --no-daemon < server-in > server-output.log 2>&1; echo "exit=$?" >> server-output.log) &
          exec 3>server-in
          for i in $(seq 1 120); do
            if grep -q "Done (" server-output.log; then break; fi
            if grep -q "exit=" server-output.log; then break; fi
            sleep 5
          done
          sleep 20
          echo "stop" >&3
          for i in $(seq 1 12); do grep -q "exit=" server-output.log && break; sleep 5; done
          exec 3>&-
          grep -q "exit=" server-output.log || { echo "Server did not stop from stdin; terminating JVMs"; pkill -TERM java || true; sleep 10; }
          tail -40 server-output.log
          grep -q "Done (" server-output.log
          ! grep -E "Exception in server tick loop|Encountered an unexpected exception|NoClassDefFoundError|ClassNotFoundException|for invalid dist|Mod loading has failed" server-output.log
      - name: Upload JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbil-jar
          path: build/libs/*.jar
          if-no-files-found: ignore
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbil-logs
          path: |
            build-output.log
            gametest-output.log
            server-output.log
          if-no-files-found: ignore
