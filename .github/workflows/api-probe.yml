name: api-probe

on:
  push:
    paths:
      - 'tools/api-probe.txt'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare mapped Minecraft
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-daemon -q || true
      - name: javap
        run: |
          JAR=$(find build/fg_cache ~/.gradle/caches -name 'forge-1.20.1-*_mapped_official_1.20.1.jar' | head -1)
          echo "JAR=$JAR"
          CP="$JAR"
          for j in $(find ~/.gradle/caches/modules-2 -name '*.jar' | grep -E 'joml|brigadier|datafixerupper|authlib|blaze3d|lwjgl-3|eventbus|fmlcore|javafmllanguage|forgespi|guava'); do CP="$CP:$j"; done
          grep -v '^#' tools/api-probe.txt | while read -r line; do
            [ -z "$line" ] && continue
            echo "=================== $line"
            javap -cp "$CP" -protected $line 2>&1 | head -400
          done
